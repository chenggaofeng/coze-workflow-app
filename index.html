<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coze 工作流平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app"></div>
    
    <script>
        // Simple router
        const routes = {
            '/': renderHome,
            '/login': renderLogin,
            '/register': renderRegister,
        };
        
        let currentUser = null;
        let token = localStorage.getItem('token');
        
        // Check auth on load
        if (token) {
            try {
                currentUser = JSON.parse(localStorage.getItem('user') || '{}');
            } catch (e) {
                token = null;
            }
        }
        
        function navigate(path) {
            window.history.pushState({}, '', path);
            render();
        }
        
        function render() {
            const path = window.location.pathname;
            const route = routes[path] || renderHome;
            document.getElementById('app').innerHTML = route();
            attachEventListeners();
        }
        
        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
                    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
                        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">登录</h1>
                        <div id="error" class="hidden bg-red-50 text-red-600 p-3 rounded mb-4 text-sm"></div>
                        <form id="loginForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                                <input type="text" id="username" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                                <input type="password" id="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition-colors">登录</button>
                        </form>
                        <p class="mt-4 text-center text-sm text-gray-600">
                            还没有账号？<a href="#" onclick="navigate('/register'); return false;" class="text-blue-600 hover:underline">立即注册</a>
                        </p>
                    </div>
                </div>
            `;
        }
        
        function renderRegister() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-teal-100">
                    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
                        <h1 class="text-2xl font-bold text-center mb-2 text-gray-800">注册</h1>
                        <p class="text-center text-sm text-gray-600 mb-6">新用户赠送 3 小时免费试用</p>
                        <div id="error" class="hidden bg-red-50 text-red-600 p-3 rounded mb-4 text-sm"></div>
                        <form id="registerForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                                <input type="text" id="username" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                                <input type="password" id="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" required>
                            </div>
                            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition-colors">注册</button>
                        </form>
                        <p class="mt-4 text-center text-sm text-gray-600">
                            已有账号？<a href="#" onclick="navigate('/login'); return false;" class="text-green-600 hover:underline">立即登录</a>
                        </p>
                    </div>
                </div>
            `;
        }
        
        function renderHome() {
            if (!token) {
                setTimeout(() => navigate('/login'), 0);
                return '';
            }
            
            return `
                <div class="min-h-screen bg-gray-50">
                    <header class="bg-white shadow-sm">
                        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                            <h1 class="text-xl font-bold text-gray-800">Coze 工作流平台</h1>
                            <div class="flex items-center gap-4">
                                <span class="text-sm text-gray-600">用户: ${currentUser?.username || ''}</span>
                                <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">退出</button>
                            </div>
                        </div>
                    </header>
                    <main class="max-w-7xl mx-auto px-4 py-8">
                        <h2 class="text-lg font-semibold text-gray-800 mb-4">可用工作流</h2>
                        <div id="workflows" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div class="text-center py-12 text-gray-500">加载中...</div>
                        </div>
                    </main>
                </div>
            `;
        }
        
        function attachEventListeners() {
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;
                    
                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password })
                        });
                        const data = await res.json();
                        
                        if (data.success) {
                            token = data.token;
                            currentUser = data.user;
                            localStorage.setItem('token', token);
                            localStorage.setItem('user', JSON.stringify(currentUser));
                            navigate('/');
                        } else {
                            showError(data.error);
                        }
                    } catch (err) {
                        showError('网络错误');
                    }
                });
            }
            
            const registerForm = document.getElementById('registerForm');
            if (registerForm) {
                registerForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;
                    
                    try {
                        const res = await fetch('/api/auth/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password })
                        });
                        const data = await res.json();
                        
                        if (data.success) {
                            token = data.token;
                            currentUser = data.user;
                            localStorage.setItem('token', token);
                            localStorage.setItem('user', JSON.stringify(currentUser));
                            navigate('/');
                        } else {
                            showError(data.error);
                        }
                    } catch (err) {
                        showError('网络错误');
                    }
                });
            }
            
            // Load workflows if on home page
            if (window.location.pathname === '/' && token) {
                loadWorkflows();
            }
        }
        
        function showError(msg) {
            const errorDiv = document.getElementById('error');
            if (errorDiv) {
                errorDiv.textContent = msg;
                errorDiv.classList.remove('hidden');
            }
        }
        
        async function loadWorkflows() {
            try {
                const res = await fetch('/api/workflow/list', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                
                if (data.success) {
                    const container = document.getElementById('workflows');
                    if (data.workflows.length === 0) {
                        container.innerHTML = '<div class="text-center py-12 text-gray-500">暂无可用工作流</div>';
                    } else {
                        container.innerHTML = data.workflows.map(w => \`
                            <div class="bg-white rounded-lg shadow p-6">
                                <h3 class="text-lg font-semibold text-gray-800 mb-2">\${w.name}</h3>
                                <p class="text-gray-600 text-sm mb-4">\${w.description || '暂无描述'}</p>
                                <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-sm">
                                    \${w.input_params ? w.input_params.split(',').length : 0} 个参数
                                </span>
                            </div>
                        \`).join('');
                    }
                }
            } catch (err) {
                console.error('加载工作流失败:', err);
            }
        }
        
        function logout() {
            token = null;
            currentUser = null;
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            navigate('/login');
        }
        
        // Handle browser back/forward
        window.onpopstate = render;
        
        // Initial render
        render();
    </script>
</body>
</html>
